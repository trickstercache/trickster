# kind cluster for the ALB autodiscovery Kubernetes integration scenario
# (TestALBDiscoveryKind). A separate worker node is essential: the test
# severs the API-server connection by pausing the control-plane node's
# container, and the workloads must live on a node that keeps running
# (kind retains the control-plane NoSchedule taint when workers exist, so
# pods land on the worker). extraPortMappings therefore expose the
# in-cluster Trickster's NodePort front and metrics listeners on the host
# via the worker node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trickster-it
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30081
        hostPort: 30081
      # the Ingress controller smoke test's front listener
      # (integration/kind/ingress.yaml), applied separately
      - containerPort: 30082
        hostPort: 30082
      # the endpoint-mode Ingress controller scenario (ingress-endpoint.yaml)
      - containerPort: 30083
        hostPort: 30083
      - containerPort: 30084
        hostPort: 30084
      # the Gateway API controller scenarios (gateway.yaml): the edge
      # Gateway's HTTP and HTTPS listeners, the controller's metrics, and the
      # listener its Ingress annotation scenario names
      - containerPort: 30085
        hostPort: 30085
      - containerPort: 30086
        hostPort: 30086
      - containerPort: 30087
        hostPort: 30087
      - containerPort: 30088
        hostPort: 30088
