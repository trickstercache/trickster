# Config for TestRateLimitListener. The listener bucket must not count readiness.

listeners:
  default:
    port: 8539
    rate_limiter_name: rl-it-listen
  metrics:
    port: 8540
  mgmt:
    port: 8541

logging:
  log_level: info

caches:
  mem1:
    provider: memory

rate_limiters:
  rl-it-listen:
    limit: 1
    window: 1m

backends:
  rl-it-prom:
    provider: prometheus
    origin_url: http://127.0.0.1:9090
    cache_name: mem1
