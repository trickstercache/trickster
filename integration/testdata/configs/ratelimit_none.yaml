# Config for TestRateLimitPathNoneKeepsListener. Its limiter names are not used by earlier tests.

listeners:
  default:
    port: 8539
    rate_limiter_name: rl-it-none-listen
  metrics:
    port: 8540
  mgmt:
    port: 8541

logging:
  log_level: info

caches:
  mem1:
    provider: memory

rate_limiters:
  rl-it-none-listen:
    limit: 1
    window: 1m
  rl-it-none-route:
    limit: 10
    window: 1m

backends:
  rl-it-prom:
    provider: prometheus
    origin_url: http://127.0.0.1:9090
    cache_name: mem1
    rate_limiter_name: rl-it-none-route
    paths:
      - path: /api/v1/labels
        handler: proxy
        rate_limiter_name: none
