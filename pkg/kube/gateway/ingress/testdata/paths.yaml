apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: trickster
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: trickstercache.org/gateway-controller
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: shop
spec:
  ingressClassName: trickster
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /exact/thing
            pathType: Exact
            backend:
              service:
                name: web-svc
                port:
                  name: http
          - path: /prefixed
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 8080
          - path: /implementation
            pathType: ImplementationSpecific
            backend:
              service:
                name: web-svc
                port:
                  number: 8080
