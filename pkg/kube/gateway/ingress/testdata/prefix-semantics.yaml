apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: trickster
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: trickstercache.org/gateway-controller
---
apiVersion: v1
kind: Service
metadata:
  name: foo-svc
  namespace: shop
spec:
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: baz-svc
  namespace: shop
spec:
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: exact-svc
  namespace: shop
spec:
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fallback-svc
  namespace: shop
spec:
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: shop
spec:
  ingressClassName: trickster
  defaultBackend:
    service:
      name: fallback-svc
      port:
        number: 8080
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /foo
            pathType: Prefix
            backend:
              service:
                name: foo-svc
                port:
                  number: 8080
          - path: /baz/
            pathType: Prefix
            backend:
              service:
                name: baz-svc
                port:
                  number: 8080
          - path: /exact
            pathType: Exact
            backend:
              service:
                name: exact-svc
                port:
                  number: 8080
