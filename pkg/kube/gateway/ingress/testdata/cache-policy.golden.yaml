backends:
    kgw--ingress.shop.prom_r0:
        provider: prometheus
        origin_url: http://prom-svc.shop.svc:9090
        hosts:
            - prom.example.com
        listener_names:
            - default
        cache_name: objects
        cache_key_prefix: ingress.shop.prom
        timeout: 15s
        path_routing_disabled: true
        path_defaults_disabled: true
        preserve_host: true
        paths:
            - path: /
              match_type: segment
              handler: proxycache
              methods:
                - GET
                - HEAD
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /
              match_type: segment
              handler: proxy
              methods:
                - POST
                - PUT
                - DELETE
                - CONNECT
                - OPTIONS
                - TRACE
                - PATCH
                - PURGE
                - '*'
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /api/v1/query
              match_type: exact
              handler: proxycache
              methods:
                - HEAD
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /api/v1/query
              match_type: exact
              handler: proxy
              methods:
                - CONNECT
                - DELETE
                - OPTIONS
                - PATCH
                - PURGE
                - PUT
                - TRACE
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /api/v1/series
              match_type: exact
              handler: proxycache
              methods:
                - HEAD
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /api/v1/series
              match_type: exact
              handler: proxy
              methods:
                - CONNECT
                - DELETE
                - OPTIONS
                - PATCH
                - PURGE
                - PUT
                - TRACE
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /api/v1/query
              match_type: exact
              handler: query
              methods:
                - GET
                - POST
              cache_key_params:
                - query
                - time
                - step
              hide_result_header: true
            - path: /api/v1/series
              match_type: exact
              handler: series
              methods:
                - GET
                - POST
              cache_key_params:
                - match[]
                - start
                - end
                - query
                - step
              hide_result_header: true
    kgw--ingress.shop.prom_r1:
        provider: rpc
        origin_url: http://prom-svc.shop.svc:9090
        hosts:
            - prom.example.com
        listener_names:
            - default
        cache_name: objects
        cache_key_prefix: ingress.shop.prom
        timeout: 15s
        path_routing_disabled: true
        path_defaults_disabled: true
        preserve_host: true
        paths:
            - path: /api/v1/query_range
              match_type: exact
              handler: proxycache
              methods:
                - GET
                - HEAD
              cache_key_params:
                - query
                - step
              hide_result_header: true
            - path: /api/v1/query_range
              match_type: exact
              handler: proxy
              methods:
                - POST
                - PUT
                - DELETE
                - CONNECT
                - OPTIONS
                - TRACE
                - PATCH
                - PURGE
                - '*'
              cache_key_params:
                - query
                - step
              hide_result_header: true
    kgw--ingress.shop.site_r0:
        provider: rpc
        origin_url: http://web-svc.shop.svc:8080
        hosts:
            - site.example.com
        listener_names:
            - default
        cache_key_prefix: ingress.shop.site
        max_ttl: 5m0s
        path_routing_disabled: true
        path_defaults_disabled: true
        preserve_host: true
        paths:
            - path: /
              match_type: segment
              handler: proxycache
              methods:
                - GET
                - HEAD
            - path: /
              match_type: segment
              handler: proxy
              methods:
                - POST
                - PUT
                - DELETE
                - CONNECT
                - OPTIONS
                - TRACE
                - PATCH
                - PURGE
                - '*'
