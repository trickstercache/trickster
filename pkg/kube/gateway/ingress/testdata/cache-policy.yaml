apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: trickster
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: trickstercache.org/gateway-controller
---
apiVersion: v1
kind: Service
metadata:
  name: prom-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - port: 8080
---
# the exact path is one the prometheus provider predefines, so the provider is withheld
# from that rule alone
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prom
  namespace: shop
  annotations:
    trickstercache.org/handler: proxycache
    trickstercache.org/timeout: 15s
spec:
  ingressClassName: trickster
  rules:
    - host: prom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prom-svc
                port:
                  number: 9090
          - path: /api/v1/query_range
            pathType: Exact
            backend:
              service:
                name: prom-svc
                port:
                  number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: shop
spec:
  ingressClassName: trickster
  rules:
    - host: site.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 8080
---
# on the Ingress: written over its annotations
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: prom-ingress
  namespace: shop
spec:
  targetRefs:
    - group: networking.k8s.io
      kind: Ingress
      name: prom
  provider: prometheus
  cacheName: objects
  cacheKeyParams:
    - query
    - step
  resultHeader: Hide
---
# on the Service: reaches the Ingress backend naming it
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: web-service
  namespace: shop
spec:
  targetRefs:
    - kind: Service
      name: web-svc
  handler: proxycache
  maxTTL: 5m
