backends:
    kgw--ingress.shop.web_r0:
        provider: alb
        hosts:
            - shop.example.com
        listener_names:
            - default
        path_routing_disabled: true
        path_defaults_disabled: true
        paths:
            - path: /gone
              match_type: segment
              handler: alb
              methods:
                - '*'
        alb:
            mechanism: rr
            pool:
                - name: kgw--ingress.shop.web_r0_b0
                  weight: 1
