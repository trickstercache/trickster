apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: trickster
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: trickstercache.org/gateway-controller
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
# an issued cookie with a lifetime and an idle timeout
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: shop
  creationTimestamp: "2026-01-01T00:00:00Z"
  annotations:
    trickstercache.org/sticky: cookie
    trickstercache.org/sticky-ttl: 30m
    trickstercache.org/sticky-idle: 5m
spec:
  ingressClassName: trickster
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 8080
---
# a table kept by a tenant header, on the same host
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: shop
  creationTimestamp: "2026-01-02T00:00:00Z"
  annotations:
    trickstercache.org/load-balancing: p2c
    trickstercache.org/sticky: table
    trickstercache.org/sticky-key: header:X-Tenant
spec:
  ingressClassName: trickster
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 8080
