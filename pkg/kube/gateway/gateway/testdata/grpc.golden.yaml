listeners:
    kgw--listener-http-80:
        port: 80
    kgw--listener-http-8080:
        port: 8080
backends:
    kgw--grpcroute.shop.rpc_r0:
        provider: rp
        origin_url: http://grpc-svc.shop.svc:9000
        hosts:
            - rpc.example.com
        listener_names:
            - kgw--listener-http-80
        cache_key_prefix: grpcroute.shop.rpc
        path_routing_disabled: true
        path_defaults_disabled: true
        h2c_prior_knowledge: true
        preserve_host: true
        paths:
            - path: /shop.v1.Orders
              match_type: segment
              handler: proxy
              methods:
                - POST
              request_headers:
                x-route: rpc
            - path: /shop.v1.Carts/GetCart
              match_type: exact
              handler: proxy
              methods:
                - POST
              request_headers:
                x-route: rpc
              match_headers:
                - name: x-tenant
                  value: gold
    kgw--grpcroute.shop.rpc_r1:
        provider: rp
        origin_url: http://grpc-svc.shop.svc:9000
