        path_routing_disabled: true
        path_defaults_disabled: true
        h2c_prior_knowledge: true
        preserve_host: true
        paths:
            - path: ^/[^/]+/Health$
              match_type: regex
              handler: proxy
              methods:
                - POST
            - path: ^/(?:shop\.v[0-9]+\.Users)/(?:Get.*)$
