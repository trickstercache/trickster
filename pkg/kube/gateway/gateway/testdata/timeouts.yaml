apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: infra
spec:
  gatewayClassName: trickster
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: canary-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
# a rule bounding its upstream exchange and retrying, served by one backendRef
# and by a weighted pair, so the settings land on the path the engine serves
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bounded
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: 5s
        backendRequest: 2s
      retry:
        codes: [502, 503]
        attempts: 2
        backoff: 100ms
      backendRefs:
        - name: web-svc
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /split
      timeouts:
        backendRequest: 1500ms
      retry: {}
      backendRefs:
        - name: web-svc
          port: 8080
          weight: 3
        - name: canary-svc
          port: 8080
          weight: 1
    # zero durations bound nothing, so this rule carries no timeout
    - matches:
        - path:
            type: Exact
            value: /plain
      timeouts:
        request: 0s
      backendRefs:
        - name: web-svc
          port: 8080
