apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: infra
spec:
  gatewayClassName: trickster
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Service
metadata:
  name: prom-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8081
---
# the first rule is named, so a policy can select it alone
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - metrics.example.com
  rules:
    - name: api
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prom-svc
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: web-svc
          port: 8080
---
# declares a path the prometheus provider predefines, so the provider cannot be applied to it
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: query
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - query.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/query_range
      backendRefs:
        - name: prom-svc
          port: 9090
---
# on the Gateway, in its own namespace: the least specific layer
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: gateway-policy
  namespace: infra
  creationTimestamp: "2026-01-01T00:00:00Z"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw
  timeout: 45s
  resultHeader: Hide
---
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: metrics-route
  namespace: shop
  creationTimestamp: "2026-01-02T00:00:00Z"
spec:
  targetRefs:
    - kind: HTTPRoute
      name: metrics
  cacheName: objects
  timeout: 30s
---
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: api-rule
  namespace: shop
  creationTimestamp: "2026-01-03T00:00:00Z"
spec:
  targetRefs:
    - kind: HTTPRoute
      name: metrics
      sectionName: api
  maxTTL: 10m
---
# on the Service: every backendRef naming it is served through the provider
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: prom-service
  namespace: shop
  creationTimestamp: "2026-01-04T00:00:00Z"
spec:
  targetRefs:
    - kind: Service
      name: prom-svc
  provider: prometheus
  cacheKeyParams:
    - query
    - step
---
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: web-port
  namespace: shop
  creationTimestamp: "2026-01-05T00:00:00Z"
spec:
  targetRefs:
    - kind: Service
      name: web-svc
      sectionName: http
  handler: proxycache
  cacheKeyHeaders:
    - X-Tenant
  responseHeaders:
    +Vary: Accept-Encoding
---
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: query-prom
  namespace: shop
  creationTimestamp: "2026-01-06T00:00:00Z"
spec:
  targetRefs:
    - kind: HTTPRoute
      name: query
  provider: prometheus
---
# a newer policy for a governed target loses to the older one
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: late
  namespace: shop
  creationTimestamp: "2026-02-01T00:00:00Z"
spec:
  targetRefs:
    - kind: HTTPRoute
      name: metrics
  timeout: 1s
---
# names a cache the configuration does not define, so nothing of it applies
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: broken
  namespace: shop
  creationTimestamp: "2026-02-02T00:00:00Z"
spec:
  targetRefs:
    - kind: Service
      name: api-svc
  cacheName: absent
---
apiVersion: trickstercache.org/v1alpha1
kind: TricksterCachePolicy
metadata:
  name: missing
  namespace: shop
  creationTimestamp: "2026-02-03T00:00:00Z"
spec:
  targetRefs:
    - kind: Service
      name: absent
  timeout: 5s
