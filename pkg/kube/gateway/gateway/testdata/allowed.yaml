apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    team: a
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels:
    team: b
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: infra
spec:
  gatewayClassName: trickster
  listeners:
    - name: same
      port: 80
      protocol: HTTP
    - name: selected
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              team: a
    - name: grpc-only
      port: 8081
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: GRPCRoute
---
apiVersion: v1
kind: Service
metadata:
  name: a-svc
  namespace: tenant-a
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: b-svc
  namespace: tenant-b
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a
  namespace: tenant-a
spec:
  parentRefs:
    - name: gw
      namespace: infra
  rules:
    - backendRefs:
        - name: a-svc
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: b
  namespace: tenant-b
spec:
  parentRefs:
    - name: gw
      namespace: infra
  rules:
    - backendRefs:
        - name: b-svc
          port: 8080
