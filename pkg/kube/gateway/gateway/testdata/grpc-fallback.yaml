apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: infra
spec:
  gatewayClassName: trickster
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Service
metadata:
  name: health-svc
  namespace: shop
spec:
  ports:
    - name: grpc
      port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: shop
spec:
  ports:
    - name: grpc
      port: 9000
---
# a method-only match beside a rule naming no method: the specific method
# must reach its own Service and everything else the fallback
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: rpc
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - rpc.example.com
  rules:
    - matches:
        - method:
            method: Check
      backendRefs:
        - name: health-svc
          port: 9000
    - backendRefs:
        - name: api-svc
          port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: pattern-svc
  namespace: shop
spec:
  ports:
    - name: grpc
      port: 9000
---
# patterns with alternatives and their own anchors keep each constraint within
# its own segment
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: patterns
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - patterns.example.com
  rules:
    - matches:
        - method:
            type: RegularExpression
            service: "foo|bar"
            method: Check
        - method:
            type: RegularExpression
            service: "^baz$"
            method: "Get|List$"
        - method:
            type: RegularExpression
            service: "(^qux$)|^quux$"
            method: "^Check$"
      backendRefs:
        - name: pattern-svc
          port: 9000
    - backendRefs:
        - name: api-svc
          port: 9000
---
# an anchor away from its segment's edge cannot keep its meaning once the
# segments are joined, so the route is refused rather than widened
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: unsupported
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - refused.example.com
  rules:
    - matches:
        - method:
            type: RegularExpression
            service: "(?:^foo)+"
            method: Check
      backendRefs:
        - name: api-svc
          port: 9000
