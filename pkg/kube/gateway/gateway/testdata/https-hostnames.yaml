apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: older
  namespace: infra
  creationTimestamp: "2026-01-01T00:00:00Z"
spec:
  gatewayClassName: trickster
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: a.example.com
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: a-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: same
  namespace: infra
  creationTimestamp: "2026-02-01T00:00:00Z"
spec:
  gatewayClassName: trickster
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: a.example.com
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: a-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: other
  namespace: infra
  creationTimestamp: "2026-03-01T00:00:00Z"
spec:
  gatewayClassName: trickster
  listeners:
    - name: other-cert
      port: 443
      protocol: HTTPS
      hostname: a.example.com
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: b-tls
    - name: hostless
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: b-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: a-tls
  namespace: infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: b-tls
  namespace: infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
