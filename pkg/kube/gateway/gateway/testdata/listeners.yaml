apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: older
  namespace: infra
  creationTimestamp: "2026-01-01T00:00:00Z"
spec:
  gatewayClassName: trickster
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: a.example.com
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: a.example.com
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: a-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: newer
  namespace: infra
  creationTimestamp: "2026-02-01T00:00:00Z"
spec:
  gatewayClassName: trickster
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: b.example.com
      allowedRoutes:
        namespaces:
          from: All
    - name: shared
      port: 80
      protocol: HTTP
      hostname: a.example.com
    - name: clash
      port: 443
      protocol: HTTPS
      hostname: a.example.com
      tls:
        certificateRefs:
          - name: a-tls
    - name: twice
      port: 443
      protocol: HTTPS
      hostname: a.example.com
      tls:
        certificateRefs:
          - name: a-tls
    - name: wrong-protocol
      port: 80
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: a-tls
    - name: custom
      port: 9000
      protocol: example.com/Custom
    - name: passthrough
      port: 8443
      protocol: HTTPS
      tls:
        mode: Passthrough
---
apiVersion: v1
kind: Secret
metadata:
  name: a-tls
  namespace: infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: infra
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: infra
spec:
  parentRefs:
    - name: older
    - name: newer
  rules:
    - backendRefs:
        - name: web-svc
          port: 8080
