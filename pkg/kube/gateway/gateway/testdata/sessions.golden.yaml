discovery:
    kgw--discovery:
        provider: kubernetes
        kubernetes:
            in_cluster: true
            qps: 20
            burst: 40
            timeout: 10s
listeners:
    kgw--listener-http-80:
        port: 80
backends:
    kgw--grpcroute.shop.rpc_r0:
        provider: alb
        hosts:
            - rpc.example.com
        listener_names:
            - kgw--listener-http-80
        path_routing_disabled: true
        path_defaults_disabled: true
        paths:
            - path: ^/.*
              match_type: regex
              handler: alb
              methods:
                - POST
        alb:
            mechanism: rr
            discovery:
                discoverer_name: kgw--discovery
                template_backend: kgw--grpcroute.shop.rpc_r0_b0_tmpl
                health_mode: provider
                query:
                    kind: endpointslices
                    namespace: shop
                    service: rpc
                    port: grpc
            sticky:
                mode: header
                ttl: 0s
    kgw--grpcroute.shop.rpc_r0_b0_tmpl:
        provider: rp
        is_template: true
        cache_key_prefix: grpcroute.shop.rpc
        path_routing_disabled: true
        path_defaults_disabled: true
        h2c_prior_knowledge: true
        preserve_host: true
        paths:
            - path: /
              match_type: prefix
              handler: proxy
              methods:
                - '*'
    kgw--httproute.shop.elsewhere_r0:
        provider: alb
        hosts:
            - c.example.com
