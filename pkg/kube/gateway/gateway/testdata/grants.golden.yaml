listeners:
    kgw--listener-https-443:
        tls_port: 443
        tls_runtime_certs: true
backends:
    kgw--httproute.shop.web_r0:
        provider: rp
        origin_url: http://shared-svc.backends.svc:8080
        hosts:
            - shop.example.com
        listener_names:
            - kgw--listener-https-443
        cache_key_prefix: httproute.shop.web
        path_routing_disabled: true
        path_defaults_disabled: true
        preserve_host: true
        paths:
            - path: /shared
              match_type: exact
              handler: proxy
              methods:
                - '*'
    kgw--httproute.shop.web_r1:
        provider: alb
        hosts:
            - shop.example.com
        listener_names:
            - kgw--listener-https-443
        path_routing_disabled: true
        path_defaults_disabled: true
        paths:
            - path: /private
              match_type: exact
              handler: alb
              methods:
                - '*'
        alb:
            mechanism: rr
            pool:
                - name: kgw--httproute.shop.web_r1_b0
                  weight: 1
    kgw--httproute.shop.web_r1_b0:
        provider: rp
        origin_url: https://unresolved.kgw.invalid
        listener_names:
            - kgw--listener-https-443
        cache_key_prefix: httproute.shop.web
        path_routing_disabled: true
        path_defaults_disabled: true
        paths:
            - path: /
              match_type: prefix
              handler: localresponse
              methods:
                - '*'
              response_code: 500
              response_body: unresolved backend reference
