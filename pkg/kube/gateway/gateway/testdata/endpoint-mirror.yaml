# the endpoint routing mode, where each mirror's copies are load balanced over
# the mirror Service's endpoints through a template of its own
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: trickster
spec:
  controllerName: trickstercache.org/gateway-controller
  parametersRef:
    group: ""
    kind: ConfigMap
    name: endpoint-params
    namespace: infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-params
  namespace: infra
data:
  routing_mode: endpoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: infra
spec:
  gatewayClassName: trickster
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: canary-svc
  namespace: shop
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: audit-svc
  namespace: shop
spec:
  ports:
    - name: https
      port: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: replay-svc
  namespace: shop
spec:
  ports:
    - name: https
      port: 8443
---
