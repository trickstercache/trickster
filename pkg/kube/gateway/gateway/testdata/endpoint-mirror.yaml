# the two mirror Services verify against different names and trust stores
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: audit-tls
  namespace: shop
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: audit-svc
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ca-bundle
    hostname: audit.internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: replay-tls
  namespace: shop
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: replay-svc
  validation:
    wellKnownCACertificates: System
    hostname: replay.internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: split
  namespace: shop
spec:
  parentRefs:
    - name: gw
      namespace: infra
  hostnames:
    - shop.example.com
  rules:
    - filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: audit-svc
              port: 8443
      backendRefs:
        - name: web-svc
          port: 8080
          weight: 3
        - name: canary-svc
          port: 8080
          weight: 1
          filters:
            - type: RequestMirror
              requestMirror:
                backendRef:
                  name: replay-svc
                  port: 8443
