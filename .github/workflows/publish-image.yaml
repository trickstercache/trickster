on:
  push:
    branches:
    - main
  workflow_dispatch:
  workflow_call:
    inputs:
        prebuilt:
          description: 'Use the linux archives an earlier job in this run already uploaded'
          required: false
          type: boolean
          default: false
name: Publish Trickster Image

concurrency:
  group: publish-image-${{ github.ref_name }}

env:
  oci_metadata: |
    org.opencontainers.image.description="Open Source HTTP Reverse Proxy Cache and Time Series Dashboard Accelerator"

jobs:
  # binaries compile natively here, never inside the image build
  build:
    if: ${{ !inputs.prebuilt }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      platforms: '["linux-amd64","linux-arm64"]'
      version: ${{ github.ref_name }}
  publish-image:
    needs:
      - build
    # still runs when the build job was skipped in favor of prebuilt archives
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Download linux archives
        uses: actions/download-artifact@v4
        with:
          pattern: trickster-linux-*
          path: ./bin
          merge-multiple: true
      - name: Unpack linux archives
        run: |
          for arch in amd64 arm64; do
            mkdir -p ./dist/linux-${arch}
            tar -xzf ./bin/trickster-*.linux-${arch}.tar.gz -C ./dist/linux-${arch} --strip-components=1
          done
      # no stage runs target-architecture code, so the build needs no QEMU
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: github.repository == 'trickstercache/trickster' # skip for forks
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest tracks the highest stable release and the bare major tag the highest
      # within that major, so a backport, prerelease or branch push never moves them
      - name: Determine floating tags
        id: floating
        run: |
          stable="$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
          major="${GITHUB_REF_NAME%%.*}"
          latest=false; newest_in_major=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "$(echo "${stable}" | tail -n 1)" ] && latest=true
            [ "${GITHUB_REF_NAME}" = "$(echo "${stable}" | grep -E "^${major}\." | tail -n 1)" ] && newest_in_major=true
          fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "newest_in_major=${newest_in_major}" >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Create an image for ghcr.io/github_owner/repo_name and docker.io/github_owner/repo_name
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository_owner == 'trickstercache' && github.repository || ''}}
          annotations: ${{ env.oci_metadata }}
          labels:  ${{ env.oci_metadata }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.floating.outputs.latest == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.floating.outputs.newest_in_major == 'true' }}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          provenance: true
          sbom: true
          push: true
          file: ${{ github.workspace }}/Dockerfile
          context: ${{ github.workspace }}
          platforms: linux/amd64,linux/arm64/v8
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BIN_SOURCE=prebuilt
          tags: ${{ steps.meta.outputs.tags }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
