on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  workflow_call:
    inputs:
      draft:
        required: true
        type: boolean
        default: true
      prerelease:
        required: true
        type: boolean
        default: true
      job-suffix:
        required: false
        type: string
        default: ''

name: Publish Trickster Release to Drafts

env:
  draft: ${{ inputs.draft || true }}
  prerelease: ${{ inputs.prerelease || false }}

jobs:
  build:
    name: Build ${{ inputs.job-suffix || '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      version: ${{ github.ref_name }}
  release:
    name: Publish Release ${{ inputs.job-suffix || '' }}
    needs:
      - build
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
        #
      - name: Get bare tag
        id: baretag
        run: echo "baretag=$(echo ${{ github.ref }} | cut -b 12-)" >> "$GITHUB_OUTPUT"
        #
      - name: Checkout code
        uses: actions/checkout@v6
        #
      - name: Download per-platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: trickster-*
          path: ./bin
          merge-multiple: true
        #
      - name: Generate checksums
        run: |
          ./hack/release-sha256.sh ./bin/sha256sum.txt ./bin ${{ steps.baretag.outputs.baretag }}
        #
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=${{ github.repository}} TAG=${{ steps.baretag.outputs.baretag }} envsubst < ./hack/release-notes/notes.md > /tmp/notes.md
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            --notes-file /tmp/notes.md \
            --title "Release v${{ steps.baretag.outputs.baretag }} / ${{ steps.date.outputs.date }}" \
            --draft=${{ env.draft }} \
            --prerelease=${{ env.prerelease }} \
            ./bin/trickster-${{ steps.baretag.outputs.baretag }}.*.tar.gz \
            ./bin/trickster-${{ steps.baretag.outputs.baretag }}.*.zip \
            ./bin/sha256sum.txt
  # the image reuses the linux binaries built above, so it runs alongside the release
  publish-image:
    needs:
      - build
    uses: ./.github/workflows/publish-image.yaml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      prebuilt: true
    secrets: inherit
