apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8481"
    prometheus.io/path: "/metrics"
  name: trickster
spec:
  ports:
    - port: 8480
      targetPort: 8480
      name: http
    - port: 8481
      targetPort: 8481
      name: metrics
    # Optional native MySQL listener. Remove this entry when MySQL support is
    # not enabled in the mounted Trickster configuration.
    - port: 8486
      targetPort: 8486
      name: mysql
  selector:
    name: trickster
