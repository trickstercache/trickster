# Example only: replace every REPLACE_* value before applying. This manifest
# deliberately keeps the complete credential-bearing MySQL configuration in a
# Secret rather than the public ConfigMap. Use an external secret controller or
# your deployment system's encrypted secret format in production.
apiVersion: v1
kind: Secret
metadata:
  name: trickster-mysql-conf
type: Opaque
stringData:
  trickster.yaml: |-
    listeners:
      mysql-routed:
        protocol: mysql
        port: 8486
        connections_limit: 200
        mysql:
          handshake_timeout: 10s
          read_timeout: 30s
          write_timeout: 30s
          idle_timeout: 5m
          max_packet_size_bytes: 16777215
          max_query_size_bytes: 1048576

    authenticators:
      mysql-tenants:
        provider: basic
        users:
          tenant_a_reader: REPLACE_TENANT_A_CLIENT_PASSWORD
          tenant_b_reader: REPLACE_TENANT_B_CLIENT_PASSWORD

    caches:
      tenant-a-cache:
        provider: memory
      tenant-b-cache:
        provider: filesystem

    backends:
      tenant-a-mysql:
        provider: mysql
        authenticator_name: mysql-tenants
        origin_url: mysql://tenant_a_ro:REPLACE_TENANT_A_ORIGIN_PASSWORD@mysql-a.default.svc:3306/analytics
        cache_name: tenant-a-cache
        timeout: 30s
        max_concurrent_conns: 100
        mysql:
          max_result_rows: 100000
          max_result_size_bytes: 67108864
        healthcheck:
          interval: 5s
          timeout: 3s

      tenant-b-mysql:
        provider: mysql
        authenticator_name: mysql-tenants
        origin_url: mysql://tenant_b_ro:REPLACE_TENANT_B_ORIGIN_PASSWORD@mysql-b.default.svc:3306/analytics
        cache_name: tenant-b-cache
        timeout: 30s
        max_concurrent_conns: 100
        mysql:
          max_result_rows: 100000
          max_result_size_bytes: 67108864
        healthcheck:
          interval: 5s
          timeout: 3s

      mysql-by-tenant:
        provider: alb
        listener_names: [mysql-routed]
        authenticator_name: mysql-tenants
        alb:
          mechanism: ur
          user_router:
            default_backend: tenant-a-mysql
            users:
              tenant_a_reader:
                to_backend: tenant-a-mysql
              tenant_b_reader:
                to_backend: tenant-b-mysql

    mgmt:
      health_handler_path: /trickster/health
