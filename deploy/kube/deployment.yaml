apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: trickster
  name: trickster
spec:
  replicas: 1
  selector:
    matchLabels:
      name: trickster
  template:
    metadata:
      labels:
        name: trickster
      name: trickster
    spec:
      containers:
        - name: trickster
          image: trickstercache/trickster:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8480
              protocol: TCP
            - name: metrics
              containerPort: 8481
              protocol: TCP
            - name: mysql
              containerPort: 8486
              protocol: TCP
          volumeMounts:
            - name: cfg-volume
              mountPath: /etc/trickster
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: cfg-volume
          configMap:
            name: trickster-conf
            items:
              - key: trickster-conf
                path: trickster.yaml
