networks:
  trk-ex-front-tier:
  trk-ex-back-tier:

services:

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./docker-compose-data/prometheus-config:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - 9090:9090
    networks:
      - trk-ex-back-tier
    restart: always
    depends_on:
      prometheus_seed:
        condition: service_completed_successfully

  # generates the synthetic trips seed data (hack/seedgen) that devorigin turns
  # into Prometheus metrics. The small profile keeps the first start quick.
  seed_data_generate:
    image: golang:1.27-alpine
    network_mode: none
    working_dir: /src
    environment:
      GOFLAGS: -mod=mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
      SEED_OUT: /seed-data
      SEED_PROFILE: ${SEED_PROFILE:-small}
    volumes:
      - ../../hack/seedgen:/src:ro
      - seed-data:/seed-data
      - gocache:/go-cache
    entrypoint: ["go", "run", "."]

  # writes the last 15 days of the trips data as Prometheus metrics in
  # OpenMetrics form (hack/devorigin), for prometheus_seed to import
  prometheus_seed_generate:
    image: golang:1.27-alpine
    network_mode: none
    working_dir: /repo/hack/devorigin
    environment:
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
      DEVORIGIN_SEED_DATA: /seed-data
      DEVORIGIN_OUT: /om/trips.om
    volumes:
      - ../..:/repo:ro
      - seed-data:/seed-data:ro
      - prometheus-seed-om:/om
      - gocache:/go-cache
    entrypoint: ["go", "run", ".", "backfill"]
    depends_on:
      seed_data_generate:
        condition: service_completed_successfully

  # imports that history with promtool before prometheus starts; it skips
  # reseeding while prometheus is running
  prometheus_seed:
    image: prom/prometheus:v3.13.2
    user: "0:0"
    volumes:
      - ../../hack/devorigin/seed-prometheus.sh:/seed-prometheus.sh:ro
      - prometheus-seed-om:/om
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/seed-prometheus.sh"]
    networks:
      - trk-ex-back-tier
    depends_on:
      prometheus_seed_generate:
        condition: service_completed_successfully

  influxdb:
    image: influxdb:2.9
    volumes:
      - ./docker-compose-data/influxdb-config/config.yml:/etc/influxdb2/config.yml
      - influxdbv2:/var/lib/influxdb2
    networks:
      - trk-ex-back-tier
    restart: always
    ports:
     - 8086:8086
    command:
      - '--reporting-disabled'

  # influxdb 2.0 cli, for setting up influxdb on startup
  influxdb_cli:
    links:
      - influxdb
    image: influxdb:2.9
    volumes:
      - ./docker-compose-data/influxdb-config/setup-influxdb.sh:/bin/setup-influxdb.sh
    entrypoint: sh /bin/setup-influxdb.sh
    networks:
      - trk-ex-back-tier
    restart: on-failure:10
    depends_on:
      # Wait for the influxd service in the influxdb container has fully bootstrapped before
      # trying to setup an influxdb instance with the influxdb_cli service. 
      - influxdb

  telegraf:
    image: telegraf:1.39-alpine
    volumes:
      - ./docker-compose-data/telegraf-config/telegraf.conf:/etc/telegraf/telegraf.conf
    depends_on:
      - influxdb
    networks:
      - trk-ex-back-tier
    restart: always

  grafana:
    image: grafana/grafana:13.1.3
    user: nobody
    ports:
      - 3000:3000
    volumes:
      - ./docker-compose-data/grafana-config:/etc/grafana
      - ./docker-compose-data/dashboards:/var/lib/grafana/dashboards
    networks:
      - trk-ex-back-tier
      - trk-ex-front-tier
    restart: always

  # devorigin (hack/devorigin) serves the live trips metrics that prometheus
  # scrapes, a Prometheus API simulator under /prometheus/ and a Range request
  # origin under /byterange/, building from the repo on start
  devorigin:
    image: golang:1.27-alpine
    working_dir: /repo/hack/devorigin
    environment:
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
      DEVORIGIN_SEED_DATA: /seed-data
      DEVORIGIN_ADDR: ":8482"
    volumes:
      - ../..:/repo:ro
      - seed-data:/seed-data:ro
      - gocache:/go-cache
    entrypoint: ["/bin/sh", "-c", "go build -o /tmp/devorigin . && exec /tmp/devorigin serve"]
    # loopback only; the other containers reach it at devorigin:8482
    ports:
      - 127.0.0.1:8482:8482
    networks:
      - trk-ex-back-tier
    restart: always
    depends_on:
      seed_data_generate:
        condition: service_completed_successfully

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    networks:
      - trk-ex-back-tier
    restart: always
    volumes:
     - redis-data:/data
    command: redis-server --appendonly yes --stop-writes-on-bgsave-error no

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
     - 6831:6831/udp
     - 6832:6832/udp
     - 5778:5778
     - 16686:16686
     - 4317:4317
     - 4318:4318
     - 14250:14250
    networks:
      - trk-ex-back-tier
    restart: always

  trickster:
    image: trickstercache/trickster:2
    depends_on:
      - prometheus
      - devorigin
      - grafana
      - jaeger
      - redis
    ports:
      - 8480:8480   # primary frontend proxy port (insecure)
      - 8481:8481   # metrics port (insecure)
      # - 8483:8483 # tls frontend proxy port, unused in this demo
      - 8484:8484   # config reload port (insecure), exposed publicly for demonstration purposes only
    volumes:
      - ./docker-compose-data/trickster-config:/etc/trickster
      - ./docker-compose-data/trickster-data:/data/trickster
    networks:
      - trk-ex-back-tier
    restart: always

volumes:
  influxdbv2:
  redis-data:
  prometheus-data:
  prometheus-seed-om:
  seed-data:
  gocache:
