# Complete native MySQL User Router example.
#
# Replace every REPLACE_* placeholder before use. Authenticator user values
# expand environment variables; structured backend origin_url values do not,
# so keep this completed file in a secret store or protected filesystem.

listeners:
  mysql-routed:
    protocol: mysql
    address: ""
    port: 8486
    connections_limit: 200
    mysql:
      handshake_timeout: 10s
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 5m
      max_packet_size_bytes: 16777215
      max_query_size_bytes: 1048576

authenticators:
  mysql-tenants:
    provider: basic
    users:
      tenant_a_reader: ${TENANT_A_CLIENT_PASSWORD}
      tenant_b_reader: ${TENANT_B_CLIENT_PASSWORD}

caches:
  tenant-a-cache:
    provider: memory
    memory:
      max_size_bytes: 536870912
  tenant-b-cache:
    provider: filesystem
    filesystem:
      cache_path: /var/cache/trickster/tenant-b

backends:
  tenant-a-mysql:
    provider: mysql
    # Required by the terminal backend contract; the listener-facing router
    # still performs the one downstream authentication exchange.
    authenticator_name: mysql-tenants
    origin_url: mysql://tenant_a_ro:REPLACE_TENANT_A_ORIGIN_PASSWORD@mysql-a.example:3306/analytics
    cache_name: tenant-a-cache
    timeout: 30s
    max_concurrent_conns: 100
    max_object_size_bytes: 8388608
    mysql:
      max_result_rows: 100000
      max_result_size_bytes: 67108864
    healthcheck:
      interval: 5s
      timeout: 3s

  tenant-b-mysql:
    provider: mysql
    authenticator_name: mysql-tenants
    origin_url: mysql://tenant_b_ro:REPLACE_TENANT_B_ORIGIN_PASSWORD@mysql-b.example:3306/analytics
    cache_name: tenant-b-cache
    timeout: 30s
    max_concurrent_conns: 100
    max_object_size_bytes: 8388608
    mysql:
      max_result_rows: 100000
      max_result_size_bytes: 67108864
    healthcheck:
      interval: 5s
      timeout: 3s

  mysql-by-tenant:
    provider: alb
    listener_names: [mysql-routed]
    authenticator_name: mysql-tenants
    alb:
      mechanism: ur
      user_router:
        # Unlisted authenticated users route to tenant A. Remove this field to
        # make an unlisted user receive a bounded native MySQL no-route error.
        default_backend: tenant-a-mysql
        users:
          tenant_a_reader:
            to_backend: tenant-a-mysql
          tenant_b_reader:
            to_backend: tenant-b-mysql
