discovery:
  in-cluster:
    provider: kubernetes
backends:
  prom-template:
    provider: prometheus
    is_template: true
  static:
    provider: reverseproxy
    origin_url: 'http://example.com/'
  test-alb:
    provider: alb
    alb:
      mechanism: rr
      pool: [static]
      discovery:
        discoverer_name: in-cluster
        template_backend: prom-template
        query:
          namespace: monitoring
          service: prom
