version: "2"
issues:
  new-from-rev: origin/main
  fix: true
run:
  tests: false
linters:
  enable:
    - dupl
    - staticcheck
    - wastedassign
    - unused
    - usetesting
    - usestdlibvars
    - unconvert
    - grouper
    - gocritic
    - revive
    - gosec
    - misspell
    - whitespace
    - testifylint
    - promlinter
    - modernize
    - intrange
    - exptostd
    - errorlint
    - forbidigo
    - depguard
    - godox
    - goheader
    - gocheckcompilerdirectives
    - mirror
    - importas
    - perfsprint
  disable:
    - errcheck
    - goconst # disable due to spate of findings unrelated to the PR coming through
  settings:
    dupl:
      threshold: 150 # default is 100; have brought current codebase down to 75, but leaving default at 150 for now
    forbidigo:
      # Calls are centralized except for the standalone-core files excluded below.
      analyze-types: true
      forbid:
        - pattern: ^rand\.[^.]+$
          pkg: ^math/rand(/v2)?$
          msg: use pkg/util/weak/compat in the application or pkg/util/weak/weaktest in tests
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^fmt$
          msg: log through pkg/observability/logging, or write to a writer the caller is given
        - pattern: ^print(ln)?$
          msg: log through pkg/observability/logging, or write to a writer the caller is given
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          pkg: ^log$
          msg: log through pkg/observability/logging
        - pattern: ^os\.(Stdout|Stderr)$
          pkg: ^os$
          msg: log through pkg/observability/logging, or write to a writer the caller is given
        - pattern: ^http\.(Get|Head|Post|PostForm|DefaultClient)$
          pkg: ^net/http$
          msg: use the backend's or the component's configured HTTP client
        - pattern: ^http\.DefaultTransport$
          pkg: ^net/http$
          msg: use the backend's or the component's configured transport
        - pattern: ^context\.TODO$
          pkg: ^context$
          msg: pass the caller's context, or context.Background where there is none
        - pattern: ^(zstd\.New(Writer|Reader)|brotli\.New(Writer|WriterLevel|WriterOptions|Reader)|gzip\.New(Writer|WriterLevel|Reader))$
          pkg: ^(github\.com/klauspost/compress/(zstd|gzip)|github\.com/andybalholm/brotli|compress/gzip)$
          msg: take a pooled codec from pkg/encoding (providers.Select*Initializer, or the codec's NewEncoder/NewDecoder)
    depguard:
      # Non-cryptographic randomness goes through pkg/util/weak: compat in the application, weaktest in
      # tests and tooling. The application is cmd/ and pkg/, less tests, testutil and *test packages.
      rules:
        weak-random:
          list-mode: lax
          files:
            - $all
            - "!**/pkg/util/weak/**"
          deny:
            - pkg: math/rand$
              desc: use pkg/util/weak/compat in the application or pkg/util/weak/weaktest in tests
        weak-random-v2:
          list-mode: lax
          files:
            - $all
            - "!**/pkg/util/weak/**"
            # the standalone load-balancing core keeps its own audited randomness
            - "!**/pkg/lb/hrw/hrw.go"
            - "!**/pkg/lb/p2c/p2c.go"
            - "!**/pkg/lb/rr/rr.go"
            - "!**/pkg/lb/lbtest/lbtest.go"
          deny:
            - pkg: math/rand/v2
              desc: use pkg/util/weak/compat in the application or pkg/util/weak/weaktest in tests
        weaktest-in-application:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/pkg/**"
            - "!$test"
            - "!**/testutil/**"
            - "!**/*test/*.go"
            - "!**/pkg/util/weak/**"
          deny:
            - pkg: github.com/trickstercache/trickster/v2/pkg/util/weak/weaktest
              desc: application code uses pkg/util/weak/compat
        compat-outside-application:
          list-mode: lax
          files:
            - $test
            - "**/testutil/**"
            - "**/*test/*.go"
            - "**/hack/**"
            - "**/examples/**"
            - "!**/pkg/util/weak/**"
          deny:
            - pkg: github.com/trickstercache/trickster/v2/pkg/util/weak/compat
              desc: tests and tooling use pkg/util/weak/weaktest
    goheader:
      values:
        regexp:
          YEAR: 20\d\d
      # a block comment's lines keep their leading asterisks
      template: |-
        * Copyright {{ YEAR }} The Trickster Authors
         *
         * Licensed under the Apache License, Version 2.0 (the "License");
         * you may not use this file except in compliance with the License.
         * You may obtain a copy of the License at
         *
         *     http://www.apache.org/licenses/LICENSE-2.0
         *
         * Unless required by applicable law or agreed to in writing, software
         * distributed under the License is distributed on an "AS IS" BASIS,
         * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
         * See the License for the specific language governing permissions and
         * limitations under the License.
    godox:
      keywords:
        - TODO
        - todo
        - FIXME
    lll:
      line-length: 180
    staticcheck:
     checks:
       - all     # default
       - -ST1000 # default
       - -ST1003 # default
       - -ST1016 # default
       - -ST1020 # default
       - -ST1021 # default
       - -ST1022 # default
       - -QF1008 # prefer referencing embedded field by full reference
    gocritic:
     disabled-checks:
       - unslice # stylistic choice, ok with slice[:] references
       - ifElseChain # false positives / prefers switch statements
    gosec:
      excludes:
      - G401 # MD5 & SHA1 adequate for non-cryptographic use cases
      - G501 # MD5 & SHA1, again
      - G505 # MD5 & SHA1, again
      - G704 # False positive: trickster is a proxy and must interact with configured backends, so it must be able to make requests to arbitrary URLs
      - G705 # XSS checks are not helpful for trickster's carefully constructed responses, this has many false positives at this time; revisit later
    revive:
      enable-all-rules: true
      rules:
        - name: unhandled-error
          arguments: # Allow skipping errors for the following functions
          - fmt.Print
          - fmt.Println
          - fmt.Printf
          - fmt.Fprintf
          - fmt.Fprint
          - strings.Builder.WriteString
          - os.Remove
          - encoding/pem.Encode
          - strings.Builder.WriteByte
          - strings.Builder.Write
          - bytes.Buffer.WriteString
          - bytes.Buffer.WriteByte
          - text/tabwriter.Writer.Write
          - text/tabwriter.Writer.Flush
          - io.Writer.Write
          - io.Closer.Close
          - io.Copy
          - bytes.Buffer.Write
          - net/http.ResponseWriter.Write
          - mime/multipart.Writer.Close
          - mime/multipart.Writer.SetBoundary
          - net/http.Request.ParseForm
          - github.com/klauspost/compress/gzip.Writer.Close
          - github.com/klauspost/compress/flate.Writer.Write 
          - github.com/klauspost/compress/flate.Writer.Close
          - net/http.Request.ParseMultipartForm
          - handler.ResponseEncoder.Close
          - config.Config.setDefaults
          - encoding/csv.Writer.Write
          - os.File.Close
        - name: exported
          arguments:
          - disableStutteringCheck
        - name: unused-parameter
          disabled: true # very noisy, lots of code with unused parameters; revisit later
        - name: line-length-limit
          disabled: true # prefer lll linter instead
        - name: add-constant
          disabled: true # very noisy, revisit later
        - name: empty-lines
          disabled: true # stylistic choice, ok with empty lines
        - name: cognitive-complexity
          disabled: true # too noisy, revisit later
        - name: time-naming
          disabled: true # stylistic choice, warnings not helpful
        - name: cyclomatic
          disabled: true # not helpful, perhaps later
        - name: max-public-structs
          disabled: true # not useful
        - name: function-result-limit
          disabled: true # not useful
        - name: confusing-results
          disabled: true # not useful
        - name: function-length
          disabled: true # not useful
        - name: unchecked-type-assertion
          disabled: true # not helpful, we have many of these; revisit later
        - name: unused-receiver
          disabled: true # not helpful, revisit later
        - name: flag-parameter
          disabled: true # not helpful, revisit later
        - name: unexported-naming
          disabled: true # not helpful, false positives
        - name: redefines-builtin-id
          disabled: true # not helpful
        - name: argument-limit
          disabled: true # not helpful
        - name: confusing-naming
          disabled: true # not helpful, revisit later
        - name: use-any
          disabled: true # too many hits, revisit in standalone PR
        - name: deep-exit
          disabled: true # not helpful
        - name: max-control-nesting
          disabled: true # not helpful
        - name: defer
          disabled: true # not helpful
        - name: struct-tag
          disabled: true # not helpful
        - name: bare-return
          disabled: true # stylistic choice, ok with bare returns
        - name: import-shadowing
          disabled: true # not helpful; considering a stylistic choice
        - name: enforce-switch-style
          disabled: true # disable 'switch must have a default case clause (revive)' checks
        - name: var-naming
          disabled: true # disable 'meaningless package names' (e.g., types, util, etc.) checks
        - name: package-naming
          disabled: true # disable 'bad package name' (e.g., types, util, etc.) checks
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Each exclusion names the rule it lifts by its message, so a file excused one rule keeps the others.
      - path: pkg/util/weak/
        linters:
          - forbidigo
        text: pkg/util/weak/compat
      # Keep the standalone load-balancing core's existing, audited randomness.
      - path: ^pkg/lb/(hrw/hrw|p2c/p2c|rr/rr|lbtest/lbtest)\.go$
        linters:
          - forbidigo
        text: pkg/util/weak/compat
      # The command line's usage and validation output is printed for a person at a terminal.
      - path: ^pkg/(appinfo/usage/usage\.go|daemon/)
        linters:
          - forbidigo
        text: fmt\.Print
      # The logging package is where output streams are chosen.
      - path: ^pkg/observability/logging/
        linters:
          - forbidigo
        text: os\.(Stdout|Stderr)
      - path: ^pkg/testutil/
        linters:
          - forbidigo
        text: http\.DefaultTransport
      # A test may reach its own test servers with Go's default client, stop at a fatal log, and build
      # its fixtures with a codec of its own.
      - path: _test\.go$
        linters:
          - forbidigo
        text: ((http|log|context)\.|pooled codec)
      # The codec packages are where the pooled codecs are built.
      - path: ^pkg/encoding/
        linters:
          - forbidigo
        text: pooled codec
      # The TODOs there were before godox counted them; any other fails.
      - linters:
          - godox
        source: (support comparison of other values via 'where'|set this at some point|Revisit when LRU is re-implemented)
      # The license header check covers the project's own packages and commands.
      - path: ^(hack|examples)/|^pkg/backends/influxdb/promremote/prompb/
        linters:
          - goheader
      # Developer tools and example programs print for the person running them.
      - path: ^(hack|examples)/
        linters:
          - forbidigo
        text: (fmt\.Print|`print|os\.(Stdout|Stderr)|pooled codec)
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
  - gci
  - goimports
  - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(github.com/trickstercache) 
        - default
