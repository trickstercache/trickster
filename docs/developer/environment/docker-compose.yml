services:

  # caches

  redis:
    image: redis:8-alpine
    restart: always
    ports:
     - 6379:6379
    volumes:
     - redis-data:/data
    command: redis-server --appendonly yes --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # ui's

  grafana:
    image: grafana/grafana:13.1.3
    user: nobody
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_INSTALL_PLUGINS=vertamedia-clickhouse-datasource,grafana-clickhouse-datasource
    volumes:
      - ./docker-compose-data/grafana-config:/etc/grafana
      - ./docker-compose-data/dashboards:/var/lib/grafana/dashboards
    build:
      context: .
      network: host
    restart: always
    ports:
     - 3000:3000
    depends_on:
      influxdb2:
        condition: service_started
      prometheus:
        condition: service_started
      mysql:
        condition: service_healthy

  # TSDBs

  prometheus:
    image: prom/prometheus:v3.13.2
    user: nobody
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker-compose-data/prometheus-config:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    build:
      context: .
      network: host
    ports:
     - 9090:9090
    restart: always

  # influxdb 2.x
  influxdb2:
    image: influxdb:2.9
    volumes:
      # Mount for influxdb data directory and configuration
      - ./docker-compose-data/influxdb2-config/config.yml:/etc/influxdb2/config.yml
      - influxdbv2:/var/lib/influxdb2
    build:
      context: .
      network: host
    restart: always
    ports:
     - 8086:8086
    command:
      - '--reporting-disabled'

  # influxdb 2.0 cli, for seeding influxdb on startup
  influxdb2_seed:
    links:
      - influxdb2
    image: influxdb:2.9
    volumes:
      - ./docker-compose-data/influxdb2-config/setup-influxdb2.sh:/bin/setup-influxdb2.sh
  # Use these same configurations parameters in your telegraf configuration, mytelegraf.conf.
    entrypoint: sh /bin/setup-influxdb2.sh
    build:
      context: .
      network: host
    restart: on-failure:10
    depends_on:
      # Wait for the influxd service in the influxdb container to start before
      # trying to setup an influxdb instance with the influxdb_cli service. 
      - influxdb2

  # clickhouse
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    ports:
     - 9000:9000
     - 8123:8123
    build:
      context: .
      network: host
    volumes:
      - ./docker-compose-data/clickhouse-config/users/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: always

  # downloads the shared NYC taxi seed data cache used by both the clickhouse
  # and mysql seeders, so they can run in any order or in parallel
  seed_data_fetch:
    image: clickhouse/clickhouse-server:25.3
    volumes:
      - ./docker-compose-data/clickhouse-config/seeding:/seeding
    entrypoint: /seeding/download.sh
    build:
      context: .
      network: host

  # clickouse-client, for seeding clickhouse on startup
  clickhouse_seed:
    links:
      - clickhouse
    image: clickhouse/clickhouse-server:26.7
    volumes:
      - ./docker-compose-data/clickhouse-config/seeding:/seeding
    entrypoint: /seeding/seed.sh
    build:
      context: .
      network: host
    depends_on:
      clickhouse:
        condition: service_started
      seed_data_fetch:
        condition: service_completed_successfully

  # mysql
  mysql:
    image: mysql:8.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--local-infile=1'
      - '--default-time-zone=+00:00'
    environment:
      MYSQL_ROOT_PASSWORD: trickster-dev-root
      MYSQL_DATABASE: trickster
    ports:
     - 3306:3306
    build:
      context: .
      network: host
    volumes:
      - ./docker-compose-data/mysql-config/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # mysql client, for seeding mysql on startup; shares the NYC taxi download
  # cache with the clickhouse seeder
  mysql_seed:
    image: mysql:8.4
    environment:
      MYSQL_SERVER_ADDR: mysql
      MYSQL_DATABASE: trickster
      MYSQL_SEED_USER: seeder
      MYSQL_SEED_PASSWORD: trickster-dev-seed
    volumes:
      - ./docker-compose-data/mysql-config/seeding:/seeding
      - ./docker-compose-data/clickhouse-config/seeding/data:/seeding/data
    entrypoint: /seeding/seed.sh
    build:
      context: .
      network: host
    depends_on:
      mysql:
        condition: service_healthy
      seed_data_fetch:
        condition: service_completed_successfully

  # graphite (carbon-cache + graphite-web, whisper storage)
  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-5
    ports:
     - 8081:80     # graphite-web (render / metrics APIs)
     - 2003:2003   # carbon plaintext ingest
    environment:
      - GRAPHITE_DEFAULT_CACHE_DURATION=0
      - STATSD_DISABLED=1
    volumes:
      - ./docker-compose-data/graphite-config/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
      - ./docker-compose-data/graphite-config/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf
      - graphite-data:/opt/graphite/storage
    build:
      context: .
      network: host
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1/metrics/find?query=carbon"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: always

  # graphite seeder: backfills deterministic data straight into whisper files,
  # validates it through graphite-web, then exits. Also run by
  # `make developer-seed-data` (with GRAPHITE_SEED_FORCE=1 to recreate files).
  graphite_seed:
    image: graphiteapp/graphite-statsd:1.1.10-5
    entrypoint: ["/opt/graphite/bin/python3", "/generator/generator.py", "seed"]
    environment:
      - GRAPHITE_WEB_URL=http://graphite
      - GRAPHITE_SEED_WINDOW=6w
    volumes:
      - ./docker-compose-data/graphite-config:/generator:ro
      - ./docker-compose-data/graphite-config/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf:ro
      - ./docker-compose-data/graphite-config/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf:ro
      - graphite-data:/opt/graphite/storage
    build:
      context: .
      network: host
    depends_on:
      graphite:
        condition: service_healthy

  # graphite generator sidecar: catches up any gap since it last ran, then
  # streams the same deterministic function of time into carbon (port 2003)
  # at every step boundary, forever. See graphite-config/generator.py.
  graphite_generator:
    image: graphiteapp/graphite-statsd:1.1.10-5
    entrypoint: ["/opt/graphite/bin/python3", "/generator/generator.py", "stream"]
    environment:
      - CARBON_HOST=graphite
      - CARBON_PORT=2003
    volumes:
      - ./docker-compose-data/graphite-config:/generator:ro
      - ./docker-compose-data/graphite-config/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf:ro
      - ./docker-compose-data/graphite-config/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf:ro
      - graphite-data:/opt/graphite/storage
    build:
      context: .
      network: host
    restart: always
    depends_on:
      graphite_seed:
        condition: service_completed_successfully

  # Mocks

  mockster:
    image: tricksterproxy/mockster:latest
    build:
      context: .
      network: host
    restart: always
    ports:
     - 8482:8482

  # Tracing

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
     - 6831:6831/udp
     - 6832:6832/udp
     - 5778:5778
     - 16686:16686
     - 4317:4317
     - 4318:4318
     - 14250:14250
    build:
      context: .
      network: host
    restart: always

  # polling

  telegraf:
    image: telegraf:1.39-alpine
    restart: always
    volumes:
      - ./docker-compose-data/telegraf-config/telegraf.conf:/etc/telegraf/telegraf.conf
    depends_on:
      - influxdb2

  # -- INTEGRATION CONTAINERS BELOW --
  # Integration-test-only services. These stay commented out so developer
  # workstations never run them; `make integration-start` (repo root)
  # uncomments everything between the BELOW/ABOVE markers before bringing
  # the environment up, and `make integration-stop` comments them back out
  # after stopping it. Lines in this section are toggled by prefixing '#'
  # at column 0 -- do not hand-edit the commenting style.
  #
  # coredns serves the mutable trickster.test zone for the ALB
  # autodiscovery dns_srv/dns_a integration tests; the zone file lives in
  # the gitignored docker-compose-data/coredns-zones/ directory, seeded by
  # make integration-start and rewritten by the tests mid-run.
#  coredns:
#    image: coredns/coredns:1.12.0
#    command: -conf /etc/coredns/Corefile
#    ports:
#      - 5399:53/udp
#      - 5399:53/tcp
#    volumes:
#      - ./docker-compose-data/coredns/Corefile:/etc/coredns/Corefile:ro
#      - ./docker-compose-data/coredns-zones:/zones
  # -- INTEGRATION CONTAINERS ABOVE --

volumes:
  graphite-data:
  influxdbv2:
  prometheus-data:
  mysql-data:
  redis-data:
