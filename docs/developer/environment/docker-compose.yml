services:

  # caches

  redis:
    image: redis:8-alpine
    restart: always
    ports:
     - 6379:6379
    volumes:
     - redis-data:/data
    command: redis-server --appendonly yes --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # ui's

  grafana:
    image: grafana/grafana:13.1.3
    user: nobody
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_INSTALL_PLUGINS=vertamedia-clickhouse-datasource,grafana-clickhouse-datasource,grafadruid-druid-datasource
    volumes:
      - ./docker-compose-data/grafana-config:/etc/grafana
      - ./docker-compose-data/dashboards:/var/lib/grafana/dashboards
    build:
      context: .
      network: host
    restart: always
    ports:
     - 3000:3000
    depends_on:
      influxdb2:
        condition: service_started
      prometheus:
        condition: service_started
      mysql:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      greptimedb:
        condition: service_healthy
      druid:
        condition: service_healthy

  # TSDBs

  prometheus:
    image: prom/prometheus:v3.13.2
    user: nobody
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker-compose-data/prometheus-config:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    build:
      context: .
      network: host
    ports:
     - 9090:9090
    restart: always
    depends_on:
      prometheus_seed:
        condition: service_completed_successfully

  # writes the last 15 days of the trips seed data as Prometheus metrics in
  # OpenMetrics form (hack/devorigin), for prometheus_seed to import. Like
  # seed_data_generate, it builds and runs with networking disabled.
  prometheus_seed_generate:
    image: golang:1.27-alpine
    network_mode: none
    working_dir: /repo/hack/devorigin
    environment:
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
      DEVORIGIN_SEED_DATA: /seed-data
      DEVORIGIN_OUT: /om/trips.om
    volumes:
      - ../../..:/repo:ro
      - ./docker-compose-data/seed-data:/seed-data:ro
      - prometheus-seed-om:/om
      - seedgen-gocache:/go-cache
    entrypoint: ["go", "run", ".", "backfill"]
    depends_on:
      seed_data_generate:
        condition: service_completed_successfully

  # promtool, for seeding prometheus with the trips history before it starts.
  # It runs as root to clean up the backfill file, then hands the data
  # directory back to nobody; it skips reseeding while prometheus is running.
  prometheus_seed:
    image: prom/prometheus:v3.13.2
    user: "0:0"
    volumes:
      - ../../../hack/devorigin/seed-prometheus.sh:/seed-prometheus.sh:ro
      - prometheus-seed-om:/om
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/seed-prometheus.sh"]
    depends_on:
      prometheus_seed_generate:
        condition: service_completed_successfully

  # influxdb 2.x
  influxdb2:
    image: influxdb:2.9
    volumes:
      # Mount for influxdb data directory and configuration
      - ./docker-compose-data/influxdb2-config/config.yml:/etc/influxdb2/config.yml
      - influxdbv2:/var/lib/influxdb2
    build:
      context: .
      network: host
    restart: always
    ports:
     - 8086:8086
    command:
      - '--reporting-disabled'

  # influxdb 2.0 cli, for seeding influxdb on startup
  influxdb2_seed:
    links:
      - influxdb2
    image: influxdb:2.9
    volumes:
      - ./docker-compose-data/influxdb2-config/setup-influxdb2.sh:/bin/setup-influxdb2.sh
  # Use these same configurations parameters in your telegraf configuration, mytelegraf.conf.
    entrypoint: sh /bin/setup-influxdb2.sh
    build:
      context: .
      network: host
    restart: on-failure:10
    depends_on:
      # Wait for the influxd service in the influxdb container to start before
      # trying to setup an influxdb instance with the influxdb_cli service. 
      - influxdb2

  # influxdb 3.x
  influxdb3:
    image: quay.io/influxdb/influxdb3-core:latest
    ports:
      - 8181:8181
    volumes:
      - influxdb3-data:/var/lib/influxdb3
    build:
      context: .
      network: host
    restart: always
    command:
      - serve
      - --node-id=dev01
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --without-auth

  # Apache Druid single-node nano quickstart. The published image is
  # distroless, so start-nano.sh supplies the same five Druid services plus
  # ZooKeeper without relying on the upstream Perl supervisor.
  druid:
    image: apache/druid:37.0.0
    environment:
      DRUID_LOG_DIR: /opt/druid/log
    ports:
      - 8888:8888
    volumes:
      - druid-data:/opt/druid/var
      - druid-shared:/opt/shared
      - ./docker-compose-data/seed-data:/seed-data:ro
      - ./docker-compose-data/druid-config/start-nano.sh:/start-nano.sh:ro
    entrypoint: ["/bin/bash", "/start-nano.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8888/status/health | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: always

  # clickhouse
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    ports:
     - 9000:9000
     - 8123:8123
    build:
      context: .
      network: host
    volumes:
      - ./docker-compose-data/clickhouse-config/users/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml
      - ./docker-compose-data/clickhouse-config/integration-memory.xml:/etc/clickhouse-server/config.d/integration-memory.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: always

  # generates the shared synthetic trips seed data (hack/seedgen) that the
  # clickhouse, mysql, timescaledb, greptimedb and druid seeders load. The output is
  # byte-identical on every run, is verified against a pinned hash, and needs
  # no network access, so the service runs with networking disabled to prove it.
  seed_data_generate:
    image: golang:1.27-alpine
    network_mode: none
    working_dir: /src
    environment:
      GOFLAGS: -mod=mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
      SEED_OUT: /seed-data
      SEED_PROFILE: ${SEED_PROFILE:-default}
    volumes:
      - ../../../hack/seedgen:/src:ro
      - ./docker-compose-data/seed-data:/seed-data
      - seedgen-gocache:/go-cache
    entrypoint: ["go", "run", "."]

  # clickhouse-client, for seeding clickhouse on startup
  clickhouse_seed:
    links:
      - clickhouse
    image: clickhouse/clickhouse-server:26.7
    volumes:
      - ./docker-compose-data/clickhouse-config/seeding:/seeding
      - ./docker-compose-data/seed-data:/seeding/data:ro
    entrypoint: /seeding/seed.sh
    build:
      context: .
      network: host
    depends_on:
      clickhouse:
        condition: service_started
      seed_data_generate:
        condition: service_completed_successfully

  # Druid native-batch seeder (hack/druidseed). It reads the same generated
  # TSV files and seed-window metadata as ClickHouse/MySQL; the batch transform
  # shifts __time so the dashboard remains centered around the current time.
  druid_seed:
    image: golang:1.27-alpine
    working_dir: /src
    environment:
      DRUID_URL: http://druid:8888
      DRUID_DATASOURCE: trips
      DRUID_SEED_DATA: /seed-data
      GOFLAGS: -mod=mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
    volumes:
      - ../../../hack/druidseed:/src:ro
      - ./docker-compose-data/seed-data:/seed-data:ro
      - seedgen-gocache:/go-cache
    entrypoint: ["go", "run", "."]
    depends_on:
      druid:
        condition: service_healthy
      seed_data_generate:
        condition: service_completed_successfully

  # mysql
  mysql:
    image: mysql:8.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--local-infile=1'
      - '--default-time-zone=+00:00'
    environment:
      MYSQL_ROOT_PASSWORD: trickster-dev-root
      MYSQL_DATABASE: trickster
    ports:
     - 3306:3306
    build:
      context: .
      network: host
    volumes:
      - ./docker-compose-data/mysql-config/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # mysql client, for seeding mysql on startup from the shared generated
  # seed data
  mysql_seed:
    image: mysql:8.4
    environment:
      MYSQL_SERVER_ADDR: mysql
      MYSQL_DATABASE: trickster
      MYSQL_SEED_USER: seeder
      MYSQL_SEED_PASSWORD: trickster-dev-seed
    volumes:
      - ./docker-compose-data/mysql-config/seeding:/seeding
      - ./docker-compose-data/seed-data:/seeding/data:ro
    entrypoint: /seeding/seed.sh
    build:
      context: .
      network: host
    depends_on:
      mysql:
        condition: service_healthy
      seed_data_generate:
        condition: service_completed_successfully

  # timescaledb (PostgreSQL 18 + TimescaleDB, Timescale License image so
  # time_bucket_gapfill and other TSL features are testable). The image ships
  # its own scripts in /docker-entrypoint-initdb.d, so the init SQL is mounted
  # as a single file rather than over the whole directory. PostgreSQL 18 images
  # keep data in /var/lib/postgresql/18/docker and refuse to start with a mount
  # at the older /var/lib/postgresql/data, so the volume mounts one level up.
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg18
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - 'postgres'
      - '-c'
      - 'timezone=UTC'
      - '-c'
      - 'log_timezone=UTC'
    environment:
      POSTGRES_PASSWORD: trickster-dev-root
      POSTGRES_DB: trickster
      TIMESCALEDB_TELEMETRY: "off"
    ports:
     - 5432:5432
    build:
      context: .
      network: host
    volumes:
      - ./docker-compose-data/timescaledb-config/init/01-users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - timescaledb-data:/var/lib/postgresql
    restart: always
    healthcheck:
      # -h forces TCP: the entrypoint's temporary init server listens on the
      # unix socket only, so the service is not healthy until init completes
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d trickster"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # psql client, for seeding timescaledb on startup from the shared generated
  # seed data
  timescaledb_seed:
    image: timescale/timescaledb:2.30.1-pg18
    environment:
      TIMESCALEDB_SERVER_ADDR: timescaledb
      TIMESCALEDB_DATABASE: trickster
      TIMESCALEDB_SEED_USER: seeder
      TIMESCALEDB_SEED_PASSWORD: trickster-dev-seed
    volumes:
      - ./docker-compose-data/timescaledb-config/seeding:/seeding
      - ./docker-compose-data/seed-data:/seeding/data:ro
    entrypoint: /seeding/seed.sh
    build:
      context: .
      network: host
    depends_on:
      timescaledb:
        condition: service_healthy
      seed_data_generate:
        condition: service_completed_successfully

  # GreptimeDB standalone, with HTTP, gRPC, MySQL and PostgreSQL endpoints.
  greptimedb:
    # Includes #9295 (Grafana's comment-only PostgreSQL health query).
    image: greptime/greptimedb-nightly:nightly-20260923-e91faa9df@sha256:657e0d3e5899f7e17db2bf6810264c1d1e8fff84055a90938201aedc86a19468
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - standalone
      - start
      - --config-file=/etc/greptimedb/standalone.toml
      - --data-home=/greptimedb-data
      - --user-provider=static_user_provider:file:/etc/greptimedb/users
    volumes:
      - ./docker-compose-data/greptimedb-config:/etc/greptimedb:ro
      - greptimedb-data:/greptimedb-data
    ports:
      - 4000:4000
      - 4001:4001
      - 4002:4002
      - 4003:4003
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # SQL loader preserves the shared fixture's DATE and narrow numeric types.
  greptimedb_seed:
    image: golang:1.27-alpine
    working_dir: /src
    environment:
      GREPTIMEDB_URL: http://greptimedb:4000
      GREPTIMEDB_DATABASE: public
      GREPTIMEDB_SEED_USER: seeder
      GREPTIMEDB_SEED_PASSWORD: trickster-dev-seed
      GREPTIMEDB_SEED_DATA: /seed-data
      GOFLAGS: -mod=mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
    volumes:
      - ../../../hack/greptimeseed:/src:ro
      - ./docker-compose-data/seed-data:/seed-data:ro
      - seedgen-gocache:/go-cache
    entrypoint: ["go", "run", "."]
    depends_on:
      greptimedb:
        condition: service_healthy
      seed_data_generate:
        condition: service_completed_successfully

  # graphite (carbon-cache + graphite-web, whisper storage)
  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-5
    ports:
     - 8081:80     # graphite-web (render / metrics APIs)
     - 2003:2003   # carbon plaintext ingest
    environment:
      - GRAPHITE_DEFAULT_CACHE_DURATION=0
      - STATSD_DISABLED=1
    volumes:
      - ./docker-compose-data/graphite-config/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
      - ./docker-compose-data/graphite-config/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf
      - graphite-data:/opt/graphite/storage
    build:
      context: .
      network: host
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1/metrics/find?query=carbon"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: always

  # graphite seeder: backfills deterministic data straight into whisper files,
  # validates it through graphite-web, then exits. Also run by
  # `make developer-seed-data` (with GRAPHITE_SEED_FORCE=1 to recreate files).
  graphite_seed:
    image: graphiteapp/graphite-statsd:1.1.10-5
    entrypoint: ["/opt/graphite/bin/python3", "/generator/generator.py", "seed"]
    environment:
      - GRAPHITE_WEB_URL=http://graphite
      - GRAPHITE_SEED_WINDOW=6w
    volumes:
      - ./docker-compose-data/graphite-config:/generator:ro
      - ./docker-compose-data/graphite-config/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf:ro
      - ./docker-compose-data/graphite-config/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf:ro
      - graphite-data:/opt/graphite/storage
    build:
      context: .
      network: host
    depends_on:
      graphite:
        condition: service_healthy

  # graphite generator sidecar: catches up any gap since it last ran, then
  # streams the same deterministic function of time into carbon (port 2003)
  # at every step boundary, forever. See graphite-config/generator.py.
  graphite_generator:
    image: graphiteapp/graphite-statsd:1.1.10-5
    entrypoint: ["/opt/graphite/bin/python3", "/generator/generator.py", "stream"]
    environment:
      - CARBON_HOST=graphite
      - CARBON_PORT=2003
    volumes:
      - ./docker-compose-data/graphite-config:/generator:ro
      - ./docker-compose-data/graphite-config/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf:ro
      - ./docker-compose-data/graphite-config/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf:ro
      - graphite-data:/opt/graphite/storage
    build:
      context: .
      network: host
    restart: always
    depends_on:
      graphite_seed:
        condition: service_completed_successfully

  # Mocks

  # devorigin (hack/devorigin) serves the live trips metrics that prometheus
  # scrapes, and the in-repo mock origins (pkg/testutil/mocks): a Prometheus
  # API simulator under /prometheus/ and a Range request origin under
  # /byterange/. It builds from the repo on start, with no network access.
  devorigin:
    image: golang:1.27-alpine
    working_dir: /repo/hack/devorigin
    environment:
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GOCACHE: /go-cache
      DEVORIGIN_SEED_DATA: /seed-data
      DEVORIGIN_ADDR: ":8482"
    volumes:
      - ../../..:/repo:ro
      - ./docker-compose-data/seed-data:/seed-data:ro
      - seedgen-gocache:/go-cache
    entrypoint: ["/bin/sh", "-c", "go build -o /tmp/devorigin . && exec /tmp/devorigin serve"]
    restart: always
    # healthy once it has compiled, caught up on the trips data, and is serving
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8482/metrics"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
      start_interval: 2s
    # loopback only: the mocks do request-driven work, and Trickster reaches them
    # from the host at 127.0.0.1:8482 while containers use devorigin:8482
    ports:
     - 127.0.0.1:8482:8482
    depends_on:
      seed_data_generate:
        condition: service_completed_successfully

  # Tracing

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
     - 6831:6831/udp
     - 6832:6832/udp
     - 5778:5778
     - 16686:16686
     - 4317:4317
     - 4318:4318
     - 14250:14250
    build:
      context: .
      network: host
    restart: always

  # polling

  telegraf:
    image: telegraf:1.39-alpine
    restart: always
    volumes:
      - ./docker-compose-data/telegraf-config/telegraf.conf:/etc/telegraf/telegraf.conf
    depends_on:
      - influxdb2
      - influxdb3

  # -- INTEGRATION CONTAINERS BELOW --
  # Integration-test-only services. These stay commented out so developer
  # workstations never run them; `make integration-start` (repo root)
  # uncomments everything between the BELOW/ABOVE markers before bringing
  # the environment up, and `make integration-stop` comments them back out
  # after stopping it. Lines in this section are toggled by prefixing '#'
  # at column 0 -- do not hand-edit the commenting style.
  #
  # coredns serves the mutable trickster.test zone for the ALB
  # autodiscovery dns_srv/dns_a integration tests; the zone file lives in
  # the gitignored docker-compose-data/coredns-zones/ directory, seeded by
  # make integration-start and rewritten by the tests mid-run.
#  coredns:
#    image: coredns/coredns:1.12.0
#    command: -conf /etc/coredns/Corefile
#    ports:
#      - 5399:53/udp
#      - 5399:53/tcp
#    volumes:
#      - ./docker-compose-data/coredns/Corefile:/etc/coredns/Corefile:ro
#      - ./docker-compose-data/coredns-zones:/zones
  # -- INTEGRATION CONTAINERS ABOVE --

volumes:
  seedgen-gocache:
  graphite-data:
  influxdbv2:
  influxdb3-data:
  druid-data:
  druid-shared:
  prometheus-data:
  prometheus-seed-om:
  mysql-data:
  timescaledb-data:
  greptimedb-data:
  redis-data:
