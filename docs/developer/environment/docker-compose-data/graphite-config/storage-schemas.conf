# storage-schemas.conf for the Trickster developer environment.
#
# Entries are scanned in order; first match wins. Every rung transition here is
# deliberate: the developer environment exists to exercise archive transitions,
# so each generated namespace sits on a different ladder.
#
# Namespace     Ladder (on disk)                 Notes
# dev.fast.*    10s:6h, 60s:7d, 10m:5y         three rungs, fine resolution
# dev.medium.*  60s:2d, 5m:30d, 1h:2y          three rungs, coarser
# dev.coarse.*  5m:90d                         one rung; short maxRetention,
#                                                so the retention clamp is easy
#                                                to observe (query from=-120d)
# dev.drift.*   30s:12h, 5m:14d, 1h:1y         *** SCHEMA DRIFT CASE ***
#                                                this file declares the ladder
#                                                below, but the generator
#                                                creates the files with the
#                                                ladder above (see generator.py
#                                                DRIFT_RETENTIONS). Config and
#                                                disk disagree on purpose.
#
# See docs/developer/environment/README.md ("Graphite") for details.

[carbon]
pattern = ^carbon\.
retentions = 10s:6h,1m:90d

[dev_fast]
pattern = ^dev\.fast\.
retentions = 10s:6h,60s:7d,10m:5y

[dev_medium]
pattern = ^dev\.medium\.
retentions = 60s:2d,5m:30d,1h:2y

[dev_coarse]
pattern = ^dev\.coarse\.
retentions = 5m:90d

# DRIFT: what this says is NOT what is on disk for dev.drift.* -- see header.
[dev_drift]
pattern = ^dev\.drift\.
retentions = 60s:2d,5m:30d,1h:2y

[default_1m_for_1day]
pattern = .*
retentions = 60s:1d
