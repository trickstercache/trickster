# storage-aggregation.conf for the Trickster developer environment.
#
# Entries are scanned in order; first match wins. More than one aggregation
# method and more than one non-default xFilesFactor are used on purpose, so that
# cross-resolution rollup discrepancies (design note §7 / decision D7) are
# reproducible against this environment.
#
# Whisper's default xFilesFactor is 0.5; the values below are all non-default.

[min]
pattern = \.(min|lower)$
xFilesFactor = 0.1
aggregationMethod = min

[max]
pattern = \.(max|upper|p99)$
xFilesFactor = 0.1
aggregationMethod = max

[sum]
pattern = \.(sum|count|dollars)$
xFilesFactor = 0
aggregationMethod = sum

[last]
pattern = \.(bytes|depth)$
xFilesFactor = 0.5
aggregationMethod = last

[default_average]
pattern = .*
xFilesFactor = 0.3
aggregationMethod = average
