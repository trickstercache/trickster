# One replica of the thanos profile's HA pair. Both scrape the same targets; the
# replica external label tells their copies apart, and Thanos deduplicates on it.
global:
  scrape_interval: 15s
  external_labels:
    cluster: dev
    replica: b
scrape_configs:
  - job_name: devorigin
    static_configs:
      - targets: ['devorigin:8482']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
