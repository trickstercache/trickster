listeners:
  # mysql1 accepts MySQL wire-protocol connections and proxies them to the
  # single backend that maps to this listener (backends -> mysql1)
  mysql1:
    protocol: mysql
    port: 8486
authenticators:
  mysql-grafana:
    provider: basic
    users:
      grafana_ro: trickster-dev-grafana
negative_caches:
  default:
    '400': 3s
    '404': 3s
    '500': 3s
    '502': 3s
caches:
  mem1:
    provider: memory
  mem2:
    provider: memory
  fs1:
    provider: filesystem
  graphite_fs:
    provider: filesystem
  redis:
    provider: redis
    redis:
      client_type: standard
      endpoint: localhost:6379
      protocol: tcp
request_rewriters:
  remove-accept-encoding:
    instructions:
      - [header, delete, Accept-Encoding]
  range-to-instant:
    instructions:
      - [path, set, /api/v1/query]
      - [param, delete, start]
      - [param, delete, end]
      - [param, delete, step]
      - [chain, exec, remove-accept-encoding]
rules:
  example:
    input_source: header
    input_key: Authorization
    input_type: string
    input_encoding: base64
    input_index: 1
    input_delimiter: ' '
    operation: prefix
    next_route: rpc1
    cases:
      - matches:
          - 'trickster:'
        next_route: sim1
tracing:
  otlp1:
    provider: otlp
    protocol: http
    endpoint: 'http://127.0.0.1:4318/v1/traces'
    tags:
      testTag: testTagValue
      testTag2: testTag2Value
  otlp2:
    provider: otlp
    protocol: http
    endpoint: 'http://127.0.0.1:4318/v1/traces'
    omit_tags:
      - http.url
backends:
  alb1:
    provider: alb
    alb:
      mechanism: fgr
      pool:
        - prom1
        - sim1
  alb2:
    provider: alb
    alb:
      mechanism: nlm
      pool:
        - lm1
        - lm2
  alb3:
    latency_min: 300ms
    provider: alb
    alb:
      mechanism: tsm
      pool:
        - prom1
        - sim1
  alb4:
    provider: alb
    alb:
      mechanism: rr
      pool:
        - prom1
        - prom1
        - prom1
        - sim1
  mysql1:
    provider: mysql
    origin_url: 'mysql://trickster:trickster-dev-upstream@127.0.0.1:3306/trickster'
    listener_name: mysql1
    authenticator_name: mysql-grafana
    cache_name: mem1
    healthcheck:
      interval: 5s
      timeout: 3s
  click1:
    provider: clickhouse
    origin_url: 'http://127.0.0.1:8123'
    cache_name: mem1
    backfill_tolerance: 60s
    timeseries_retention_factor: 2048
  graphite1:
    provider: graphite
    origin_url: 'http://127.0.0.1:8081'
    # dedicated cache so graphite's cache metrics stay separable from the
    # other backends on the Graphite dashboard; filesystem, because the
    # memory provider exports no usage/eviction gauges for the storage panels
    cache_name: graphite_fs
    # the delta cache fetches at native resolution (maxDataPoints is
    # stripped upstream, decision D3), so a wide window on a fine rung is
    # large: the 120d storage panel is ~1.6MB of JSON. The 512KB default
    # would reject it on every refresh and fall back to plain proxy.
    max_object_size_bytes: 67108864
    # the cache keeps timeseries_retention_factor points per series (default
    # 1024, which is only 3.5 days at a 5m step), cropping anything older and
    # refetching it on the next request. Size it for the widest window at the
    # finest step it will be served at (120d at 5m is 34,560 points).
    timeseries_retention_factor: 1000000
  rp1:
    provider: proxy
    origin_url: 'http://127.0.0.1:9090'
  rpc3:
    provider: rpc
    origin_url: 'http://127.0.0.1:9090'
  prom1:
    latency_max: 150ms
    latency_min: 50ms
    is_default: true
    provider: prometheus
    origin_url: 'http://127.0.0.1:9090'
    cache_name: mem1
  prom2:
    provider: prometheus
    origin_url: 'http://127.0.0.1:9090'
    cache_name: fs1
  prom3:
    provider: prometheus
    origin_url: 'http://127.0.0.1:9090'
    cache_name: redis
  flux1:
    provider: influxdb
    origin_url: 'http://127.0.0.1:8186/'
    cache_name: mem1
    backfill_tolerance: 30s
    timeseries_retention_factor: 5184000
  flux2:
    provider: influxdb
    origin_url: 'http://127.0.0.1:8086/'
    cache_name: mem1
    backfill_tolerance: 30s
    timeseries_retention_factor: 5184000
  sim1:
    provider: prometheus
    origin_url: 'http://127.0.0.1:8482/prometheus'
    cache_name: mem1
    max_idle_conns: 600
    timeseries_retention_factor: 5184000
    timeseries_ttl: 72h
    max_ttl: 24h
    max_object_size_bytes: 67108864
    healthcheck:
      interval: 300ms
      timeout: 500ms
      # uncomment and set certs to test TLS
      # tls:
      #   full_chain_cert_path: >-
      #     /example/certs/127.0.0.1.pem
      #   private_key_path: >-
      #     /example/certs/127.0.0.1-key.pem
      #   insecure_skip_verify: true
  sim2:
    provider: prometheus
    origin_url: 'http://127.0.0.1:8482/prometheus'
    cache_name: mem1
  flux-sim-1:
    provider: influxdb
    origin_url: 'http://127.0.0.1:8482/influxdb'
    cache_name: mem1
    max_idle_conns: 600
    timeseries_retention_factor: 5184000
    timeseries_ttl: 72h
    max_ttl: 24h
    max_object_size_bytes: 67108864
  lm1:
    provider: reverseproxycache
    origin_url: 'http://127.0.0.1:8482/static/testing/test1'
  lm2:
    provider: reverseproxycache
    origin_url: 'http://127.0.0.1:8482/static/testing/test2'
  rpc1:
    provider: reverseproxycache
    origin_url: 'http://127.0.0.1:8482/byterange'
    cache_name: fs1
    paths:
      - path: /
        match_type: prefix
        handler: proxycache
  rpc2:
    provider: reverseproxycache
    origin_url: 'http://127.0.0.1:8482/byterange'
    cache_name: mem1
    paths:
      - path: /
        match_type: prefix
        handler: proxycache
logging:
  log_level: info
